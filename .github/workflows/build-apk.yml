name: Build Android APK
on:
  workflow_dispatch: # 允许手动在 Actions 页面触发

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.3'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create app com.haso2007.libretts LibreTTS
          cd app
          cordova platform add android@12.0.1
          
          # 清除默认文件
          rm -rf www/*
          
          # 将当前仓库所有前端文件复制进 www 目录
          # 排除了后端函数目录和git等，因为 cordova 只需要前端 HTML/JS/CSS
          rsync -av --exclude='app' --exclude='.git' --exclude='.github' --exclude='api' --exclude='functions' ../ www/
          
          # 构建 APK
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LibreTTS-debug.apk
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
